name: CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'opstty/**'

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Lint charts
        run: |
          for chart in opstty/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "=== Linting $chart ==="
              helm lint "$chart"
            fi
          done

      - name: Template charts
        run: |
          for chart in opstty/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "=== Templating $chart ==="
              helm dependency build "$chart" 2>/dev/null || true
              helm template test-release "$chart" --debug > /dev/null
            fi
          done

      - name: Install kube-linter
        run: |
          curl -L -o kube-linter https://github.com/stackrox/kube-linter/releases/latest/download/kube-linter-linux
          chmod +x kube-linter
          sudo mv kube-linter /usr/local/bin/

      - name: Scan charts with kube-linter
        run: |
          for chart in opstty/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "=== Scanning $chart ==="
              helm dependency build "$chart" 2>/dev/null || true
              helm template test-release "$chart" 2>/dev/null | kube-linter lint - || true
            fi
          done

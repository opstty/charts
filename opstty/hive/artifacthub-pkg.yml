version: 0.1.8
name: hive
displayName: Apache Hive
createdAt: "2026-07-21T00:00:00Z"
description: A Helm chart for Apache Hive (Metastore + HiveServer2) deployment.
logoURL: https://hive.apache.org/images/hive.svg
homeURL: https://hive.apache.org
readme: ""  # Artifact Hub lira le README.md du chart automatiquement
install: |
  ```bash
  helm repo add opstty https://opstty.github.io/charts
  helm install my-hive opstty/hive
  ```
links:
  - name: Apache Hive
    url: https://hive.apache.org
  - name: GitHub
    url: https://github.com/opstty/charts
license: Apache-2.0
maintainers:
  - name: opstty
keywords:
  - apache
  - hive
  - hiveserver2
  - metastore
  - data-warehouse
annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: Fixed conditional annotations on services, ingresses, and service account
    - kind: added
      description: Added scheduling support (affinity, nodeSelector, tolerations, topologySpreadConstraints, updateStrategy)
    - kind: added
      description: Added automountServiceAccountToken rendering in service account and pod specs
    - kind: added
      description: Made init container images configurable via values
    - kind: added
      description: Added security context defaults for pods and containers
    - kind: added
      description: Added HiveServer2 initContainers extension point
    - kind: changed
      description: Comprehensive values.schema.json coverage for all chart parameters
    - kind: fixed
      description: Fixed database.external.database renamed to database.external.name matching values.yaml

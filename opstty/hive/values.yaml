# Default values for hive.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Override resource names to avoid name conflicts when deploying multiple
# releases in the same namespace.
nameOverride: ""
fullnameOverride: ""

# -- Common labels applied to all resources.
commonLabels: {}

# -- Common annotations applied to all resources.
commonAnnotations: {}

# -- Global default replica count (can be overridden per component).
replicas: 1

# -- Global image pull secrets.
imagePullSecrets: []

# -- Global image settings (used as defaults for both metastore and hiveserver2).
image:
  registry: ""
  repository: "apache/hive"
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""
  useRepositoryAsSoleImageReference: false

# -- Global environment variables injected into all containers.
env: []
# - name: MY_VAR
#   value: "my-value"

# -- Global envFrom (secrets/configmaps) injected into all containers.
envFrom: []
# - secretRef:
#     name: my-secret

# -- Global hive-site.xml properties (merged with component-specific overrides).
hiveSite:
  properties:
    hive.server2.enable.doAs: "false"
    hive.tez.exec.inplace.progress: "false"
    hive.tez.exec.print.summary: "true"
    hive.exec.scratchdir: "/opt/hive/scratch_dir"
    hive.user.install.directory: "/opt/hive/install_dir"
    tez.runtime.optimize.local.fetch: "true"
    hive.exec.submit.local.task.via.child: "false"
    mapreduce.framework.name: "local"
    tez.local.mode: "true"
    hive.execution.engine: "tez"
    hive.metastore.warehouse.dir: "/opt/hive/data/warehouse"
    metastore.metastore.event.db.notification.api.auth: "true"
    datanucleus.autoCreateSchema: "false"
    datanucleus.fixedDatastore: "true"
    datanucleus.autoStartMechanism: "SchemaTable"
    hive.metastore.schema.verification: "true"
    hadoop.security.credential.provider.path: "jceks://file/opt/hive/secrets/hive.jceks"

# -- Global metastore-site.xml properties (merged with metastore-specific overrides).
metastoreSite:
  properties:
    metastore.thrift.uris: "thrift://0.0.0.0:9083"
    metastore.task.threads.always: "org.apache.hadoop.hive.metastore.events.EventCleanerTask,org.apache.hadoop.hive.metastore.MaterializationsRebuildLockCleanerTask"
    metastore.expression.proxy: "org.apache.hadoop.hive.metastore.DefaultPartitionExpressionProxy"

# ─── ServiceAccount ──────────────────────────────────────────────────────────
serviceAccount:
  # -- Whether to create a dedicated ServiceAccount.
  create: true
  # -- Whether to auto-mount the service account token. Set to false for security.
  automountServiceAccountToken: false
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Name of the ServiceAccount. Defaults to the fullname if create=true.
  name: ""

# ─── Hive Metastore ──────────────────────────────────────────────────────────
metastore:
  # -- Enable/disable the Hive Metastore component.
  enabled: true

  # -- Number of Metastore replicas (falls back to global .Values.replicas).
  replicas: null

  # -- Pod-level security context for metastore pods.
  podSecurityContext: {}
  # -- Container-level security context for metastore containers.
  securityContext: {}

  # -- JVM maximum heap size for the metastore process.
  jvmHeapSize: "2G"

  # -- Termination grace period in seconds.
  terminationGracePeriodSeconds: 60

  # -- Deployment update strategy.
  updateStrategy:
    type: RollingUpdate

  # -- Component-specific image overrides.
  image:
    registry: ""
    repository: ""
    pullPolicy: ""
    tag: ""
    digest: ""

  # -- Component-specific image pull secrets.
  imagePullSecrets: []

  # -- Additional init containers (raw YAML, supports tpl).
  initContainers: []

  # -- Component-specific environment variables (merged with global env).
  env: []

  # -- Component-specific envFrom.
  envFrom: []

  # -- Extra volumes to attach to the Metastore pod.
  extraVolumes: []
  # - name: extra-config
  #   configMap:
  #     name: my-config

  # -- Extra volume mounts for the Metastore container.
  extraVolumeMounts: []
  # - name: extra-config
  #   mountPath: /opt/hive/conf/extra

  # -- Component-specific hive-site.xml overrides (merged on top of global).
  hiveSite:
    properties: {}

  # -- Component-specific metastore-site.xml overrides (merged on top of global).
  metastoreSite:
    properties: {}

  # -- Resource requests and limits for metastore pods.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # -- Service configuration for the Metastore.
  service:
    type: ClusterIP
    port: 9083
    annotations: {}

  # -- Startup probe configuration.
  startupProbe:
    failureThreshold: null
    periodSeconds: null

  # -- Liveness probe configuration.
  livenessProbe:
    initialDelaySeconds: null
    periodSeconds: null

  # -- Readiness probe configuration.
  readinessProbe:
    initialDelaySeconds: null
    periodSeconds: null

  # -- Ingress configuration for the Metastore (useful for exposing thrift via TCP ingress).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    # - host: hive-metastore.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
    tls: []
    # - secretName: hive-metastore-tls
    #   hosts:
    #     - hive-metastore.example.com

  # -- Affinity rules for metastore pods.
  affinity: {}
  # -- Node selector for metastore pods.
  nodeSelector: {}
  # -- Tolerations for metastore pods.
  tolerations: []
  # -- Topology spread constraints for metastore pods.
  topologySpreadConstraints: []

  # -- Embedded PostgreSQL database via Bitnami postgresql subchart.
  # Set enabled: false to provide an external database via database.external.*.
  database:
    enabled: true
    # -- Container image for the wait-for-db init container.
    waitImage:
      # -- Image repository for the wait container.
      repository: "postgres"
      # -- Image tag for the wait container.
      tag: "17-alpine"
    # -- External database connection (used when database.enabled=false).
    external:
      host: ""
      port: 5432
      name: "metastore"
      user: "hive"
      # -- Name of an existing secret containing the password.
      existingSecret: ""
      # -- Key in existingSecret that holds the password.
      existingSecretPasswordKey: "password"
    # -- JDBC driver configuration for the metastore database.
    driver:
      # -- Container image for the JDBC driver download init container.
      image:
        # -- Image repository for the driver download container.
        repository: "alpine/curl"
        # -- Image tag for the driver download container.
        tag: "8.12.0"
      # -- SHA256 checksum of the JDBC driver JAR for integrity verification.
      # Leave empty to skip verification (not recommended for production).
      sha256: ""

# ─── Bitnami PostgreSQL subchart ─────────────────────────────────────────────
# -- Configuration for the embedded Bitnami postgresql subchart.
# Ref: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  # -- Use the legacy Debian-based image from Docker Hub (bitnamilegacy).
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "16"
  auth:
    # -- Database name created for Hive Metastore.
    database: metastore
    # -- Username for the Hive Metastore database.
    username: hive
    # -- Password for the Hive user. Leave empty to auto-generate.
    # In production, use existingSecret instead.
    password: ""
    # -- Name of an existing Secret containing the PostgreSQL password.
    # The secret must contain the key "password".
    existingSecret: ""
  primary:
    persistence:
      size: 8Gi

# ─── HiveServer2 ─────────────────────────────────────────────────────────────
hiveserver2:
  # -- Enable/disable HiveServer2 component.
  enabled: false

  # -- Number of HiveServer2 replicas (falls back to global .Values.replicas).
  replicas: null

  # -- Pod-level security context for hiveserver2 pods.
  podSecurityContext: {}
  # -- Container-level security context for hiveserver2 containers.
  securityContext: {}

  # -- Termination grace period in seconds.
  terminationGracePeriodSeconds: 60

  # -- Deployment update strategy.
  updateStrategy:
    type: RollingUpdate

  # -- Component-specific image overrides.
  image:
    registry: ""
    repository: ""
    pullPolicy: ""
    tag: ""
    digest: ""

  # -- Component-specific image pull secrets.
  imagePullSecrets: []

  # -- Component-specific environment variables (merged with global env).
  env: []

  # -- Component-specific envFrom.
  envFrom: []

  # -- Additional init containers for hiveserver2 pods.
  initContainers: []

  # -- Extra volumes to attach to the HiveServer2 pod.
  extraVolumes: []

  # -- Extra volume mounts for the HiveServer2 container.
  extraVolumeMounts: []

  # -- Component-specific hive-site.xml overrides (merged on top of global).
  hiveSite:
    properties:
      hive.server2.thrift.bind.host: "0.0.0.0"
      hive.server2.webui.host: "0.0.0.0"

  # -- Resource requests and limits for hiveserver2 pods.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # -- Service configuration for HiveServer2.
  service:
    type: ClusterIP
    thriftPort: 10000
    httpPort: 10001
    webuiPort: 10002
    annotations: {}

  # -- Startup probe configuration.
  startupProbe:
    failureThreshold: null
    periodSeconds: null

  # -- Liveness probe configuration.
  livenessProbe:
    initialDelaySeconds: null
    periodSeconds: null

  # -- Readiness probe configuration.
  readinessProbe:
    initialDelaySeconds: null
    periodSeconds: null

  # -- Ingress configuration for HiveServer2.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  # -- Affinity rules for hiveserver2 pods.
  affinity: {}
  # -- Node selector for hiveserver2 pods.
  nodeSelector: {}
  # -- Tolerations for hiveserver2 pods.
  tolerations: []
  # -- Topology spread constraints for hiveserver2 pods.
  topologySpreadConstraints: []

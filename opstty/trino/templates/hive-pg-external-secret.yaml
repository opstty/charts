{{- if and .Values.hive.enabled ((.Values.hive).externalSecret).enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-hive-pg-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ ((.Values.hive).externalSecret).refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ ((.Values.hive).externalSecret).storeRef | default "vault-kv" }}
    kind: ClusterSecretStore
  target:
    name: {{ ((.Values.hive).externalSecret).secretName | default (printf "%s-hive-pg-credentials" .Release.Name) }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ ((.Values.hive).externalSecret).remoteKey }}
        property: {{ ((.Values.hive).externalSecret).remoteProperty | default "database.password" }}
    - secretKey: postgres-password
      remoteRef:
        key: {{ ((.Values.hive).externalSecret).remoteKey }}
        property: {{ ((.Values.hive).externalSecret).remoteProperty | default "database.password" }}
{{- end }}
